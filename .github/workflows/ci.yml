name: CI Pipeline

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

env:
    GO_VERSION: 1.27.4
    GITLEAKS_VERSION: 8.24.2
    ACTIONLINT_VERSION: 1.7.7
    SHELLCHECK_VERSION: 0.11.0
    GOVULNCHECK_VERSION: v1.1.4

jobs:
    check:
        name: Source Code Hygiene
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - name: Use Readonly Go Modules
              run: echo 'GOFLAGS=-mod=readonly' >> "$GITHUB_ENV"

            - name: Static Analysis
              env:
                  RUMDL_OUTPUT_FORMAT: github
              run: make check

            - name: Check Build
              run: make build

            - name: Gitleaks
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_ENABLE_COMMENTS: false
                  GITLEAKS_ENABLE_SUMMARY: true
                  GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

            - name: Install actionlint
              run: |
                  set -euo pipefail
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                  curl -fsSL "$url" | tar -xzf - actionlint
                  sudo mv actionlint /usr/local/bin/actionlint
                  actionlint -version

            - name: Run actionlint
              run: actionlint

            - name: Install ShellCheck
              run: |
                  set -euo pipefail
                  archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
                  url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
                  install_dir="${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}"
                  mkdir -p "$install_dir"
                  curl -fsSL "$url" | tar -xJ -C "$install_dir" --strip-components=1
                  echo "${install_dir}" >> "$GITHUB_PATH"
                  shellcheck --version

            - name: Run ShellCheck
              run: |
                  shellcheck -S warning scripts/lint/*.sh
                  shellcheck -S warning install.sh scripts/aws-cli-guard-disable scripts/release-assets.sh scripts/ci/govulncheck-report.sh

            - name: Run govulncheck
              id: govulncheck
              # Findings and a scanner crash on the pinned Go toolchain are
              # reported below. They do not fail this job (ADR 0031).
              continue-on-error: true
              run: |
                  set +e
                  go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./... > govulncheck.log 2>&1
                  status=$?
                  set -e
                  echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
                  cat govulncheck.log
                  exit "$status"

            - name: Report govulncheck
              if: ${{ !cancelled() && steps.govulncheck.outcome != 'skipped' }}
              env:
                  GOVULNCHECK_EXIT_CODE: ${{ steps.govulncheck.outputs.exit_code }}
                  GOVULNCHECK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  ./scripts/ci/govulncheck-report.sh --self-test
                  ./scripts/ci/govulncheck-report.sh \
                      "$GOVULNCHECK_EXIT_CODE" \
                      govulncheck.log \
                      govulncheck-comment.md \
                      "$GOVULNCHECK_RUN_URL"
                  cat govulncheck-comment.md >> "$GITHUB_STEP_SUMMARY"

            - name: Comment govulncheck On Pull Request
              if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.govulncheck.outcome != 'skipped' }}
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: govulncheck
                  path: govulncheck-comment.md
